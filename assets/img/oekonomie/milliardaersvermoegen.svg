<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Das Vermögen der Milliardäre hat sich seit 2019 mehr als verdoppelt" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="760" height="400" fill="#ffffff"/>
<text x="48.0" y="26.0" font-size="16" font-weight="600" fill="#1f1e1d" text-anchor="start">Das Vermögen der Milliardäre hat sich seit 2019 mehr als verdoppelt</text>
<text x="48.0" y="48.0" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="start">Gesamtvermögen aller Milliardäre weltweit, in Billionen US-Dollar, nicht inflationsbereinigt</text>
<text x="48.0" y="66.0" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="start">Zahl der Milliardäre: 2.153 (2019) und 3.428 (2026)</text>
