<!DOCTYPE html>
{%- assign t = site.data.i18n[page.lang] | default: site.data.i18n[site.lang] %}
<html lang="{{ page.lang | default: site.lang }}">
{% include head.html %}
<body>
  <a class="skip-link" href="#main">{{ t.skip_to_content }}</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="{{ t.home | relative_url }}">{{ t.site_title }}</a>
      <nav class="site-nav">
        <a href="{{ t.about_url | relative_url }}">{{ t.about_short }}</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <p>{{ site.author }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a> · <a href="{{ t.about_url | relative_url }}">{{ t.about }}</a></p>
    </div>
  </footer>
</body>
</html>
