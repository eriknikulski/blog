# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: "Beschwerden meiner Generation"
description: "Klima, Wirtschaft, Politik und Gesellschaft: Was auf junge und künftige Generationen zukommt – mit Zahlen und Quellen."
author: "Erik Nikulski"
email: "blog@eriknikulski.me"
lang: de
url: "https://eriknikulski.me"
baseurl: "/blog"

goatcounter: "eriknikulski"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  chapters:
    output: true

defaults:
  - scope:
      path: ""
    values:
      lang: de
  - scope:
      path: "_chapters/de"
      type: chapters
    values:
      layout: chapter
      lang: de
      permalink: /:title/
  - scope:
      path: "_chapters/en"
      type: chapters
    values:
      layout: chapter
      lang: en
      permalink: /en/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - "Claude outputs"   # Vorschaubilder aus Claude, nicht veröffentlichen
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
